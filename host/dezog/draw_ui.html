<!--
  Custom UI for DeZog zsim (inserted into the "Z80 Simulator" panel).
  Draw a digit, send it to the Z80 (firmware/z80_draw_main.c) through the
  ports simulated by host/dezog/draw_logic.js, and show the answer, the
  inference t-states, a register snapshot and a RAM dump read by the Z80.
-->
<style>
  #nn { --ink: var(--vscode-foreground, #ddd); --dim: var(--vscode-descriptionForeground, #999);
        --line: var(--vscode-panel-border, #555); --accent: var(--vscode-focusBorder, #3794ff);
        --changed: #e5534b; font-family: var(--vscode-font-family, sans-serif); color: var(--ink); }
  #nn .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  #nn .box { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  #nn h3 { margin: 0 0 6px 0; font-size: 1em; font-weight: 600; }
  #nn canvas.draw { background: #000; cursor: crosshair; touch-action: none; display: block; }
  #nn canvas.prev { width: 140px; height: 140px; image-rendering: pixelated; background: #000; display: block; }
  #nn button { margin: 4px 4px 0 0; }
  #nn .mono { font-family: var(--vscode-editor-font-family, monospace); font-size: 12px; }
  #nn .digit { font-size: 56px; font-weight: 700; line-height: 1; min-width: 1ch; }
  #nn .dim { color: var(--dim); }
  #nn table.scores td { padding: 0 4px; }
  #nn .track { position: relative; height: 14px; }
  #nn .zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); }
  #nn .bar { position: absolute; top: 2px; height: 10px; background: var(--accent); }
  #nn .bar.neg { background: var(--dim); }
  #nn .bar.win { background: #3fb950; }
  #nn .hq { display: flex; gap: 1px; margin-top: 4px; }
  #nn .hq div { width: 8px; height: 14px; }
  #nn table.regs td { padding: 1px 6px 1px 0; }
  #nn .chg { color: var(--changed); font-weight: 700; }
  #nn pre.ram { margin: 6px 0 0 0; white-space: pre; overflow-x: auto; }
  #nn input.addr { width: 6ch; }
</style>

<div id="nn">
  <div class="row">
    <div class="box">
      <h3>Draw</h3>
      <canvas id="nn_draw" class="draw" width="280" height="280"></canvas>
      <button id="nn_send">Send to Z80</button>
      <button id="nn_clear">Clear</button>
      <div id="nn_status" class="dim" style="margin-top:4px">Waiting for the custom logic…</div>
    </div>

    <div class="box">
      <h3>Z80 input (28×28)</h3>
      <canvas id="nn_prev" class="prev" width="28" height="28"></canvas>
      <h3 style="margin-top:10px">Result</h3>
      <div class="row" style="gap:10px; align-items:center">
        <div id="nn_digit" class="digit">–</div>
        <div class="mono">
          <div>t-states: <span id="nn_cycles">–</span></div>
          <div class="dim">at 4 MHz: <span id="nn_secs">–</span></div>
        </div>
      </div>
      <div class="dim mono" style="margin-top:6px">h_q (hidden layer, 0..127)</div>
      <div id="nn_hq" class="hq"></div>
    </div>

    <div class="box">
      <h3>Scores (acc2)</h3>
      <table class="scores mono" id="nn_scores"></table>
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="box">
      <h3>Registers <span class="dim mono" style="font-weight:400">(snapshot after nn_infer)</span></h3>
      <table class="regs mono" id="nn_regs"></table>
      <div class="mono" style="margin-top:4px">Flags: <span id="nn_flags">–</span></div>
    </div>

    <div class="box" style="flex:1; min-width:420px">
      <h3>Memory</h3>
      <div class="mono">
        0x<input id="nn_addr" class="addr mono" value="8000">
        <select id="nn_len" class="mono">
          <option value="64">64</option><option value="128">128</option>
          <option value="256" selected>256</option>
        </select>
        <button id="nn_read">Read</button>
        <span class="dim">jump:</span>
        <button data-jump="x">x</button>
        <button data-jump="trace">trace</button>
        <button data-jump="regs">regs</button>
        <button data-jump="sp">stack (SP)</button>
        <button data-jump="weights">weights</button>
      </div>
      <pre id="nn_ram" class="ram mono dim">Press Read (the Z80 must be running).</pre>
    </div>
  </div>
</div>

<script>
(function () {
  const SIZE = 280, BRUSH = 10;          // same as host/draw.py
  const INK = 30, BOX = 20, FRAME = 28, CENTER = 14, THRESH = 127;
  const $ = id => document.getElementById(id);
  const hex = (v, n) => v.toString(16).toUpperCase().padStart(n, '0');

  /* ---------- drawing ---------- */
  const draw = $('nn_draw'), dctx = draw.getContext('2d', { willReadFrequently: true });
  const prev = $('nn_prev'), pctx = prev.getContext('2d');
  let last = null;

  function clearCanvas() {
    dctx.fillStyle = '#000'; dctx.fillRect(0, 0, SIZE, SIZE);
    showPreview(new Uint8Array(FRAME * FRAME));
  }
  function pos(e) {
    const r = draw.getBoundingClientRect();
    return [(e.clientX - r.left) * SIZE / r.width, (e.clientY - r.top) * SIZE / r.height];
  }
  function paint(e) {
    const [x, y] = pos(e);
    dctx.fillStyle = dctx.strokeStyle = '#fff';
    dctx.lineWidth = 2 * BRUSH; dctx.lineCap = 'round';
    if (last) { dctx.beginPath(); dctx.moveTo(...last); dctx.lineTo(x, y); dctx.stroke(); }
    dctx.beginPath(); dctx.arc(x, y, BRUSH, 0, 2 * Math.PI); dctx.fill();
    last = [x, y];
  }
  draw.addEventListener('pointerdown', e => { draw.setPointerCapture(e.pointerId); last = null; paint(e); });
  draw.addEventListener('pointermove', e => { if (e.buttons & 1) paint(e); });
  draw.addEventListener('pointerup', () => { last = null; });

  /* ---------- preprocessing, mirrors preprocess() in host/draw.py ----------
     Difference: the browser downsamples with its own filter, not LANCZOS. */
  function preprocess() {
    const src = dctx.getImageData(0, 0, SIZE, SIZE).data;
    let r0 = SIZE, r1 = -1, c0 = SIZE, c1 = -1;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (src[4 * (r * SIZE + c)] > INK) {
          if (r < r0) r0 = r; if (r > r1) r1 = r;
          if (c < c0) c0 = c; if (c > c1) c1 = c;
        }
    if (r1 < 0) return null;
    const w = c1 - c0 + 1, h = r1 - r0 + 1, scale = BOX / Math.max(w, h);
    const sw = Math.max(1, Math.round(w * scale)), sh = Math.max(1, Math.round(h * scale));

    const small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    const sctx = small.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(draw, c0, r0, w, h, 0, 0, sw, sh);
    const sp = sctx.getImageData(0, 0, sw, sh).data;

    let total = 0, mr = 0, mc = 0;
    for (let r = 0; r < sh; r++)
      for (let c = 0; c < sw; c++) {
        const v = sp[4 * (r * sw + c)];
        total += v; mr += r * v; mc += c * v;
      }
    if (total === 0) return null;
    const oy = Math.round(CENTER - mr / total), ox = Math.round(CENTER - mc / total);

    const x = new Uint8Array(FRAME * FRAME);
    for (let r = 0; r < sh; r++)
      for (let c = 0; c < sw; c++) {
        const fr = r + oy, fc = c + ox;
        if (fr >= 0 && fr < FRAME && fc >= 0 && fc < FRAME)
          x[fr * FRAME + fc] = sp[4 * (r * sw + c)] > THRESH ? 1 : 0;
      }
    return x;
  }

  function showPreview(x) {
    const img = pctx.createImageData(FRAME, FRAME);
    for (let i = 0; i < x.length; i++) {
      const v = x[i] ? 255 : 0;
      img.data.set([v, v, v, 255], 4 * i);
    }
    pctx.putImageData(img, 0, 0);
  }

  function pack(x) {                      // like z80nn.pack_image: MSB = leftmost pixel
    const out = [];
    for (let i = 0; i < x.length; i += 8) {
      let b = 0;
      for (let k = 0; k < 8; k++) b = (b << 1) | x[i + k];
      out.push(b);
    }
    return out;
  }

  /* ---------- talking to the custom logic ---------- */
  const send = bytes => UIAPI.sendToCustomLogic({ command: 'send', bytes });
  const status = t => { $('nn_status').textContent = t; };

  function requestMemory() {
    const addr = parseInt($('nn_addr').value, 16) & 0xFFFF;
    const len = parseInt($('nn_len').value, 10);
    $('nn_addr').value = hex(addr, 4);
    send([0x4D, addr & 0xFF, addr >> 8, len & 0xFF]);   // 'M' lo hi len (256 -> 0)
    pendingDumps.push(addr);
  }
  const pendingDumps = [];                 // addresses of 'M' requests not answered yet, in order
  let addresses = {};

  $('nn_send').onclick = () => {
    const x = preprocess();
    if (!x) { status('Draw a digit first'); return; }
    showPreview(x);
    send([0x49, ...pack(x)]);              // 'I' + 98 bytes
    $('nn_digit').textContent = '…';
    status('Queued, waiting for the Z80 (is it running?)');
  };
  $('nn_clear').onclick = () => { clearCanvas(); $('nn_digit').textContent = '–'; };
  $('nn_read').onclick = requestMemory;
  $('nn_addr').addEventListener('keydown', e => { if (e.key === 'Enter') requestMemory(); });
  document.querySelectorAll('#nn [data-jump]').forEach(b => b.onclick = () => {
    const a = addresses[b.dataset.jump];
    if (a === undefined) { status('Address not known yet'); return; }
    $('nn_addr').value = hex(a, 4);
    requestMemory();
  });

  const u16 = (b, i) => b[i] | (b[i + 1] << 8);
  const i32 = (b, i) => b[i] | (b[i + 1] << 8) | (b[i + 2] << 16) | (b[i + 3] << 24);

  UIAPI.receivedFromCustomLogic = msg => {
    if (msg.command === 'ready') {
      status(msg.queued ? 'Ready (' + msg.queued + ' queued)' : 'Ready: draw a digit and press Send');
    } else if (msg.command === 'started') {
      if (msg.type === 'I') status('Z80 running inference…');
    } else if (msg.command === 'reply') {
      const b = msg.bytes;
      if (msg.type === 'A') {
        addresses = { x: u16(b, 0), trace: u16(b, 2), regs: u16(b, 4), weights: 0x1000,
                      sp: addresses.sp };
      } else if (msg.type === 'R') {
        showResult(b, msg.cycles);
      } else if (msg.type === 'G') {
        showRegs(b);
        requestMemory();                   // refresh the RAM view after each inference
      } else if (msg.type === 'M') {
        showMemory(pendingDumps.shift() ?? 0, b);
      }
    }
  };

  /* ---------- result ---------- */
  function showResult(b, cycles) {
    const digit = b[0];
    const hq = b.slice(1, 33);
    const acc2 = [];
    for (let k = 0; k < 10; k++) acc2.push(i32(b, 33 + 4 * k));
    $('nn_digit').textContent = digit;
    if (cycles !== undefined) {
      $('nn_cycles').textContent = cycles.toLocaleString('en');
      $('nn_secs').textContent = (cycles / 4e6).toFixed(2) + ' s';
    }
    status('Done: the Z80 says ' + digit);

    $('nn_hq').innerHTML = hq.map(v => {
      const g = Math.round(v * 255 / 127);
      return '<div title="' + v + '" style="background:rgb(' + g + ',' + g + ',' + g + ')"></div>';
    }).join('');

    // Diverging bars on one linear scale: zero line inside the track,
    // negatives grow left of it, positives right, so "further right" = higher score.
    const W = 200;
    const lo = Math.min(0, ...acc2), hi = Math.max(0, ...acc2);
    const px = v => Math.round(W * (v - lo) / Math.max(1, hi - lo));
    const zero = px(0);
    $('nn_scores').innerHTML = acc2.map((v, k) => {
      const left = Math.min(px(v), zero), width = Math.max(1, Math.abs(px(v) - zero));
      const cls = k === digit ? 'bar win' : (v < 0 ? 'bar neg' : 'bar');
      return '<tr><td>' + k + '</td><td><div class="track" style="width:' + W + 'px">' +
             '<div class="zero" style="left:' + zero + 'px"></div>' +
             '<div class="' + cls + '" style="left:' + left + 'px; width:' + width + 'px"></div>' +
             '</div></td><td style="text-align:right">' + v + '</td></tr>';
    }).join('');
  }

  /* ---------- registers ---------- */
  const REGS = [['AF', 0], ['BC', 2], ['DE', 4], ['HL', 6], ['IX', 8], ['IY', 10], ['SP', 12], ['PC', 14],
                ["AF'", 16], ["BC'", 18], ["DE'", 20], ["HL'", 22]];
  let prevRegs = null;

  function showRegs(b) {
    const val = {};
    for (const [n, o] of REGS) val[n] = u16(b, o);
    val.I = b[24]; val.R = b[25];
    const cell = (n, w) => {
      const chg = prevRegs && prevRegs[n] !== val[n] ? ' class="chg"' : '';
      return '<td class="dim">' + n + '</td><td' + chg + '>' + hex(val[n], w) + '</td>';
    };
    const rows = [['AF', "AF'"], ['BC', "BC'"], ['DE', "DE'"], ['HL', "HL'"], ['IX', 'IY'], ['SP', 'PC']];
    $('nn_regs').innerHTML = rows.map(([a, c]) => '<tr>' + cell(a, 4) + cell(c, 4) + '</tr>').join('') +
                             '<tr>' + cell('I', 2) + cell('R', 2) + '</tr>';
    const f = val.AF & 0xFF;
    $('nn_flags').innerHTML = [['S', 7], ['Z', 6], ['H', 4], ['P/V', 2], ['N', 1], ['C', 0]]
      .map(([n, bit]) => (f >> bit) & 1 ? '<b>' + n + '</b>' : '<span class="dim">' + n.toLowerCase() + '</span>')
      .join(' ');
    addresses.sp = val.SP;
    prevRegs = val;
  }

  /* ---------- memory ---------- */
  const lastDump = new Map();              // address -> byte, to mark changes like DeZog

  function showMemory(addr, b) {
    const lines = [];
    for (let i = 0; i < b.length; i += 16) {
      let h = '', a = '', k;
      for (k = 0; k < 16 && i + k < b.length; k++) {
        const ad = (addr + i + k) & 0xFFFF, v = b[i + k];
        const old = lastDump.get(ad);
        const s = hex(v, 2);
        h += (old !== undefined && old !== v ? '<span class="chg">' + s + '</span>' : s) + ' ';
        a += v >= 32 && v < 127 ? String.fromCharCode(v).replace('&', '&amp;').replace('<', '&lt;') : '.';
        lastDump.set(ad, v);
      }
      lines.push('<span class="dim">' + hex((addr + i) & 0xFFFF, 4) + '</span>  ' + h + '   '.repeat(16 - k) +
                 ' <span class="dim">' + a + '</span>');
    }
    const ram = $('nn_ram');
    ram.classList.remove('dim');
    ram.innerHTML = lines.join('\n');
  }

  clearCanvas();
})();
</script>
