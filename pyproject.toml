[project]
name = "mnist-on-z80"
version = "1.0.0"
description = "Handwritten digit recognition on a Z80: an MLP trained in PyTorch, quantized to integers, run in C on the Z80."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Scaffidi Muta" }, { name = "Edoardo Panella" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",       # training, host tools and tests
    "pillow>=11.0",     # drawing window (src/host/draw.py)
    "pyserial>=3.5",    # talking to the real board (src/host/z80nn.py)
    "torch>=2.6",       # training and quantization (src/training/)
    "torchvision>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# The scripts are run directly (python src/...); nothing is installed as a package.
package = false
